    <path d="M48 27 L56 34 L48 41" fill="none" stroke="#F0B650" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M33 34 H54" stroke="#FFF2C2" stroke-width="2" stroke-linecap="round" opacity="0.72"/>
