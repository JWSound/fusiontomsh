    <path d="M20 55 L39 52 L34 16 Z" fill="#6BC6D9" opacity="0.95"/>
    <path d="M34 16 L39 52 L47 31 Z" fill="#86D2C6" opacity="0.95"/>
    <path d="M18 21 L34 16 L47 31 L39 52 L20 55 L7 42 Z" fill="none" stroke="#E7EDF2" stroke-width="2"/>
    <path d="M18 21 L39 52 M20 55 L47 31 M34 16 L20 55" stroke="#E7EDF2" stroke-width="1.45" opacity="0.9"/>
    <circle cx="7" cy="42" r="2.4" fill="#F7D36A" stroke="#5E6A76" stroke-width="1"/>
    <circle cx="18" cy="21" r="2.4" fill="#F7D36A" stroke="#5E6A76" stroke-width="1"/>
    <circle cx="34" cy="16" r="2.4" fill="#F7D36A" stroke="#5E6A76" stroke-width="1"/>
    <circle cx="47" cy="31" r="2.4" fill="#F7D36A" stroke="#5E6A76" stroke-width="1"/>
    <circle cx="39" cy="52" r="2.4" fill="#F7D36A" stroke="#5E6A76" stroke-width="1"/>
    <circle cx="20" cy="55" r="2.4" fill="#F7D36A" stroke="#5E6A76" stroke-width="1"/>
  </g>

