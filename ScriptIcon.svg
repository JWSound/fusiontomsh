    <path d="M7 42 L18 21 L34 16 L47 31 L39 52 L20 55 Z" fill="#334553" stroke="#D9E4EE" stroke-width="2"/>
    <path d="M7 42 L20 55 L18 21 Z" fill="#2C83B8" opacity="0.92"/>
